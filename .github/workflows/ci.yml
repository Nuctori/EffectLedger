name: CI - Effect Cost Algebra Audit Gate
on:
  push:
    branches: [ main, master ]
  pull_request:
jobs:
  audit-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          # R2A-03（二轮审计）：不开 cache:true——actions/setup-dotnet 的缓存依赖 packages.lock.json 哈希做键，
          # 本仓库未启用 RestorePackagesWithLockFile，开了会在 GitHub Actions 上直接红（'Dependencies lock file is not found'）。
      - name: Restore
        run: dotnet restore Cosmos.EffectAlgebra.slnx
      - name: Build (编译期门禁：TreatWarningsAsErrors 使警告=错误)
        run: dotnet build Cosmos.EffectAlgebra.slnx -c Release --no-restore -warnaserror
      - name: Install Dafny + Z3 (P3 形式验证门依赖：D1 记录的版本组合)
        run: |
          dotnet tool install --global Dafny
          mkdir -p $HOME/.dotnet/tools/z3/bin
          curl -sL https://github.com/Z3Prover/z3/releases/download/z3-4.12.1/z3-4.12.1-x64-glibc-2.35.zip -o /tmp/z3.zip
          cd /tmp && unzip -o -q z3.zip && cp z3-4.12.1-x64-glibc-2.35/bin/z3 $HOME/.dotnet/tools/z3/bin/z3-4.12.1
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
      - name: Dafny verify (P3 形式规约门：0 errors 才放行)
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"
          dafny verify --solver-path "$HOME/.dotnet/tools/z3/bin/z3-4.12.1" formal/CosmosEffectAlgebra.dfy formal/CosmosSweepLine.dfy
      - name: Test (审计 + 代数 + L2/L3 端到端；slnx 已含 SampleGame，任何失败=红)
        run: dotnet test Cosmos.EffectAlgebra.slnx -c Release --no-build --verbosity normal
